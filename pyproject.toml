[build-system]
requires = ["setuptools>=40.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "zenoss-RM-api"
version = "1.1.0"
description = "Python 2.7/3.6+ compatible client library for the Zenoss Resource Manager JSON API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*, !=3.5.*"
dependencies = [
    "requests",
    "pyOpenSSL",
    "six",
]

[project.urls]
Homepage = "https://github.com/zenoss/zenoss-RM-api"
